<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生徒用 出席スキャン ＆ ログイン</title>
    <!-- QRコード・QRスキャン・Supabaseライブラリの読み込み -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- TOTP（二段階認証）用のライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.1.4/otpauth.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background-color: #0f172a; color: #f1f5f9; padding: 20px; }
        .container { max-width: 420px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
        #canvas { width: 100%; max-width: 320px; border-radius: 8px; background: #000; transform: scaleX(-1); border: 2px solid #334155; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; display: none; }
        .success { background-color: #064e3b; color: #34d399; border: 1px solid #059669; }
        .error { background-color: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
        .box-section { background: #1e3a8a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #3b82f6; color: #eff6ff; text-align: left; }
        .input-group { margin: 10px 0; }
        select, input[type="text"], input[type="password"], input[type="number"] { width: 100%; box-sizing: border-box; padding: 8px; font-size: 1rem; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #f1f5f9; margin-top: 5px; }
        button { width: 100%; padding: 10px; background-color: #0284c7; color: white; border: none; border-radius: 4px; font-size: 1rem; margin-top: 10px; cursor: pointer; transition: background 0.2s; font-weight: bold; }
        button:hover { background-color: #0369a1; }
        .secondary-btn { background-color: #475569; margin-top: 5px; }
        .secondary-btn:hover { background-color: #334155; }
        .info-display { color: #94a3b8; margin-bottom: 15px; font-size: 0.95rem; }
        h2 { color: #f8fafc; }
        p { color: #cbd5e1; font-size: 0.95rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>出席管理システム</h2>

    <!-- ① ログイン・アカウント認証エリア -->
    <div id="auth-area" class="box-section">
        <p id="auth-title" style="margin-top:0; font-weight:bold; text-align:center;">ログインしてください</p>
        
        <div class="input-group">
            <label>メールアドレス</label>
            <input type="text" id="email-input" placeholder="example@school.com">
        </div>
        <div class="input-group">
            <label>パスワード</label>
            <input type="password" id="password-input" placeholder="パスワード">
        </div>
        
        <!-- 二段階認証コード入力用（初期は非表示） -->
        <div class="input-group" id="totp-group" style="display:none;">
            <label style="color: #38bdf8;">認証アプリの6桁コード (2FA)</label>
            <input type="text" id="totp-input" placeholder="例: 123456" maxlength="6" style="letter-spacing: 3px; text-align: center; font-size: 1.2rem;">
        </div>

        <button id="auth-btn" onclick="handleAuth()">ログイン</button>
        <button class="secondary-btn" id="toggle-mode-btn" onclick="toggleAuthMode()">アカウント登録はこちら</button>
    </div>

    <!-- ② 所属設定エリア（ログイン後） -->
    <div id="setup-area" class="box-section" style="display: none;">
        <p style="margin-top:0; font-weight:bold; text-align:center;">所属情報を設定してください</p>
        <div style="display: flex; gap: 5px;">
            <select id="dept-select">
                <option value="E">E</option><option value="S">S</option><option value="M">M</option><option value="C">C</option><option value="D">D</option>
            </select>
            <select id="grade-select">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
            </select>
        </div>
        <div class="input-group">
            <input type="number" id="num-input" placeholder="出席番号(例: 15)">
        </div>
        <button onclick="saveStudentInfo()">所属を保存してカメラ起動</button>
    </div>
    
    <!-- 設定済み情報表示エリア -->
    <div id="id-display-area" class="info-display" style="display: none;">
        ログイン中 / 所属: <strong id="current-info" style="color: #38bdf8;"></strong> 
        <a href="#" onclick="logout()" style="color:#f87171; margin-left:10px; font-size:0.8rem;">[ログアウト]</a>
    </div>

    <!-- ③ カメラ・QRスキャンエリア -->
    <div id="scan-container" style="display: none;">
        <p>教室のQRコードをカメラに向けてください</p>
        <canvas id="canvas"></canvas>
    </div>

    <div id="result" class="result-box"></div>
</div>

<script>
   
    const SUPABASE_URL = 'https://ykeaficegkxzmgohccnw.supabase.co'; // 
    const SUPABASE_ANON_KEY = 'sb_publishable__aUe6wyDdQAcB7k8pOrlPw_zOt4_ltz'; // 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SECRET_KEY = "SCHOOL_SECRET_2026";
    const TASKS_URL = "https://berufesuthihu-collab.github.io/Entrance/tasks.html";

    const video = document.createElement("video");
    const canvasElement = document.getElementById("canvas");
    const canvas = canvasElement.getContext("2d");
    const resultElement = document.getElementById("result");
    
    let isScanning = false;
    let lastTickTime = 0;
    let isSignUpMode = false; // 登録モードかログインモードか

    // 画面初期化チェック
    async function initApp() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            document.getElementById("auth-area").style.display = "block";
            document.getElementById("setup-area").style.display = "none";
            document.getElementById("scan-container").style.display = "none";
        } else {
            document.getElementById("auth-area").style.display = "none";
            checkStudentInfo(session.user.id);
        }
    }

    // ログイン / 新規登録の切り替え
    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        if (isSignUpMode) {
            document.getElementById("auth-title").innerText = "新規アカウント登録";
            document.getElementById("auth-btn").innerText = "登録する";
            document.getElementById("toggle-mode-btn").innerText = "ログイン画面に戻る";
            document.getElementById("totp-group").style.display = "none";
        } else {
            document.getElementById("auth-title").innerText = "ログインしてください";
            document.getElementById("auth-btn").innerText = "ログイン";
            document.getElementById("toggle-mode-btn").innerText = "アカウント登録はこちら";
        }
    }

    // 認証処理の実行
    async function handleAuth() {
        const email = document.getElementById("email-input").value.trim();
        const password = document.getElementById("password-input").value.trim();

        if (!email || !password) {
            alert("メールアドレスとパスワードを入力してください");
            return;
        }

        if (isSignUpMode) {
            // 新規登録
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert("登録エラー: " + error.message);
            } else {
                alert("登録確認メールを送信しました。メール内リンクをご確認ください。");
                toggleAuthMode();
            }
        } else {
            // ログイン
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert("ログイン失敗: " + error.message);
            } else {
                alert("ログイン成功！");
                initApp();
            }
        }
    }

    // ログアウト
    async function logout() {
        await supabase.auth.signOut();
        localStorage.clear();
        location.reload();
    }

    // 生徒の所属情報確認（Supabaseのローカルストレージやメタデータ管理）
    function checkStudentInfo(userId) {
        const savedClass = localStorage.getItem("student_class");
        const savedNum = localStorage.getItem("student_num");

        if (!savedClass || !savedNum) {
            document.getElementById("setup-area").style.display = "block";
            document.getElementById("scan-container").style.display = "none";
            document.getElementById("id-display-area").style.display = "none";
        } else {
            document.getElementById("setup-area").style.display = "none";
            document.getElementById("scan-container").style.display = "block";
            document.getElementById("id-display-area").style.display = "block";
            document.getElementById("current-info").innerText = savedClass + " " + savedNum + "番";
            isScanning = true;
            startCamera();
        }
    }

    // 所属情報の保存
    function saveStudentInfo() {
        const dept = document.getElementById("dept-select").value;
        const grade = document.getElementById("grade-select").value;
        const num = document.getElementById("num-input").value.trim();
        
        if (!num) { alert("出席番号を入力してください"); return; }
        
        const fullClass = dept + grade;
        localStorage.setItem("student_class", fullClass);
        localStorage.setItem("student_num", num);
        
        initApp();
    }

    // カメラ起動
    function startCamera() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => initVideoStream(stream))
            .catch(() => {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => initVideoStream(stream))
                    .catch(() => alert("カメラを起動できませんでした。"));
            });
    }

    function initVideoStream(stream) {
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(tick);
    }

    function tick(now) {
        if (!isScanning) return;
        if (now - lastTickTime > 100) {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                const imageData = canvas.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
                if (code) { isScanning = false; checkAttendance(code.data); }
            }
            lastTickTime = now;
        }
        requestAnimationFrame(tick);
    }

    // 出席データの検証とSupabaseへの保存
    async function checkAttendance(scannedToken) {
        resultElement.style.display = "block";
        const today = new Date().toLocaleDateString();
        const lastAttendanceDate = localStorage.getItem("last_attendance_date");

        if (lastAttendanceDate === today) {
            resultElement.className = "result-box error";
            resultElement.innerHTML = " 本日の出席は既に登録済みです。課題ページへ移動します...";
            setTimeout(() => { window.location.href = TASKS_URL; }, 2000);
            return;
        }

        const now = new Date();
        const currentTimeIndex = Math.floor(now.getTime() / 30000);
        
        if (scannedToken === (SECRET_KEY + "_" + currentTimeIndex) || scannedToken === (SECRET_KEY + "_" + (currentTimeIndex - 1))) {
            resultElement.className = "result-box success";
            resultElement.innerHTML = " 出席を送信中...";

            // Supabaseの attendance テーブルへ直接保存
            const { error } = await supabase.from('attendance').insert([
                { 
                    student_class: localStorage.getItem("student_class"), 
                    student_num: Number(localStorage.getItem("student_num")) 
                }
            ]);

            if (error) {
                resultElement.className = "result-box error";
                resultElement.innerHTML = " 記録に失敗しました: " + error.message;
                setTimeout(() => { resultElement.style.display = "none"; isScanning = true; }, 3000);
            } else {
                localStorage.setItem("last_attendance_date", today);
                resultElement.innerHTML = " 出席を記録しました！課題ページへ移動します...";
                setTimeout(() => { window.location.href = TASKS_URL; }, 2000);
            }
        } else {
            resultElement.className = "result-box error";
            resultElement.innerHTML = " 有効期限切れのQRコードです";
            setTimeout(() => { resultElement.style.display = "none"; isScanning = true; }, 3000);
        }
    }

    window.onload = initApp;
</script>
</body>
</html>
